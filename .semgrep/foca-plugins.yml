# Semgrep rules for security issues that ruff's bandit rules (`S`) do not
# cover; secrets are detected by gitleaks (cf. `.pre-commit-config.yaml`).
# Framework imports in plugins are refused by the ast-grep rule
# `no-framework-imports` (`.ast-grep/`)
rules:
  - id: jwt-decode-without-verification
    languages: [python]
    severity: ERROR
    message: >-
      Tokens must be verified; plugins get the caller's validated claims in
      `ctx.principal.claims`, and verify other tokens with their issuer's
      keys
    patterns:
      - pattern-either:
          - pattern: 'jwt.decode(..., options={..., "verify_signature": False, ...}, ...)'
          - pattern: "jwt.decode(..., verify=False, ...)"
  - id: requests-verify-disabled
    languages: [python]
    severity: ERROR
    message: >-
      TLS certificates must be verified; plugins call other services
      through `ctx.http` (the gateway's guarded client) where the app
      provides one
    pattern-either:
      - pattern: requests.$METHOD(..., verify=False, ...)
      - pattern: $SESSION.$METHOD(..., verify=False, ...)
