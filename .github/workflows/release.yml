# Releases one package when its tag (`<distribution>-v<version>`, e.g.,
# `foca-plugin-tes-routing-distance-v1.2.0` or `foca-plugins-v0.2.0`)
# is pushed. Fails safe: before anything is built, the tag is checked
# against the package (`python -m scripts.release release`: a package of
# this repository, its version on the tagged commit, not the example plugin)
# and the commit against `main`; CI must have passed for the commit (job
# `prepare`, which then builds the distributions). Then it builds the
# distributions with pinned tools (`prepare`) and attests their build
# provenance (`attest`; GitHub artifact attestations). A package with an
# image (`tes.data.crypt4gh`: the decryption image) then gets it built and
# pushed by digest, untagged (`push`), the digest scanned and smoke tested
# without credentials (`scan`), and only then attested, signed and tagged
# with the version (`image`); packages without an image skip these jobs.
# Then it releases the distributions to PyPI (`pypi`)
# with trusted publishing (no API token; each PyPI project trusts this
# workflow file in the `release` environment) and PEP 740 attestations, and
# creates the GitHub release (`publish`) with the notes of the package's
# `CHANGELOG.md` and its commits since its previous tag. No manual steps:
# "Re-run failed jobs" completes a partially failed release with the
# distributions and the image digest of the first attempt. Never use
# "Re-run all jobs": it builds again, and sdists aren't reproducible (the
# build backend stores file times), so PyPI and the GitHub release would get
# different files (and the image tag a new digest, which `image` refuses).
# Every job works on the pushed commit (`github.sha`), not on the tag, and
# fails if the tag no longer points to it before publishing

name: Release

on:
  push:
    # Plugins (`foca-plugin-…-v…`) and the meta distribution (`foca-plugins-v…`)
    tags: ["foca-plugin*-v*"]

permissions:
  contents: read

env:
  # As in `ci.yml` (update both together)
  UV_VERSION: "0.12.13"
  # The Docker Hub organization of the images: the repository variable
  # `DOCKERHUB_ORG` (by default `elixircloud`, as in cloud-registry), so
  # that forks publish to their own organization (set it before pushing a
  # test tag). Fully qualified (`docker.io/`), as the attestation needs it
  IMAGE_REGISTRY: docker.io/${{ vars.DOCKERHUB_ORG || 'elixircloud' }}

# One run per tag, so that tags pushed together (at most 3 per `git push`:
# GitHub creates no events for more) are all released; re-runs of a tag wait
# for its running attempt
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read # read the CI runs of the release commit
    outputs:
      path: ${{ steps.package.outputs.path }}
      name: ${{ steps.package.outputs.name }}
      version: ${{ steps.package.outputs.version }}
      prerelease: ${{ steps.package.outputs.prerelease }}
      image: ${{ steps.image.outputs.image }}
    steps:
      # The pushed commit (`github.sha`), not the tag, which may have moved
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          # Full history, to check that the release commit is on `main`
          fetch-depth: 0
      # The scripts use the standard library only
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # First, before anything is installed or built: the tag must name a
      # package that may be published, at its version on this commit
      - name: Check release tag
        id: package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          package="$(python -m scripts.release release "${TAG}")"
          for key in path name version; do
              echo "${key}=$(jq -r ".${key}" <<< "${package}")" >> "${GITHUB_OUTPUT}"
          done
          version="$(jq -r .version <<< "${package}")"
          # GitHub pre-releases: alphas, betas, release candidates and dev
          # releases (also with a post release, e.g., `1.0rc1.post1`; in
          # normalized versions, these letters mark nothing else), and all
          # packages before 1.0.0 (plugins and the meta distribution)
          if [[ "${version}" =~ (a|b|rc|\.dev)[0-9] || "${version}" == 0.* ]]; then
              echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          else
              echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          fi
      # The image of the package, built from `<package>/image/Dockerfile`
      # with the package's directory as the build context, or none. The
      # Docker Hub repository of each image is created by the maintainer
      # before the package's first release with it. A package with a
      # Dockerfile but no image name here fails, so that no image is left
      # out of a release by mistake
      - name: Determine image
        id: image
        env:
          NAME: ${{ steps.package.outputs.name }}
          PACKAGE: ${{ steps.package.outputs.path }}
        run: |
          case "${NAME}" in
              foca-plugin-tes-data-crypt4gh)
                  image="${IMAGE_REGISTRY}/foca-plugin-tes-data-crypt4gh-decrypt" ;;
              *)
                  image="" ;;
          esac
          if [[ -n "${image}" && ! -f "${PACKAGE}/image/Dockerfile" ]]; then
              echo "::error::${NAME} has an image name, but no ${PACKAGE}/image/Dockerfile"
              exit 1
          fi
          if [[ -z "${image}" && -e "${PACKAGE}/image/Dockerfile" ]]; then
              echo "::error::${PACKAGE}/image/Dockerfile has no image name in release.yml (step 'Determine image')"
              exit 1
          fi
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
      # Guards against accidental releases from unmerged commits. The `release`
      # environment's protection rules are what actually control publishing
      - name: Check release commit
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
              echo "::error::Release commit is not on 'main'"
              exit 1
          fi
          python -m scripts.checks check
          # The notes must exist, in the organization's format, before
          # anything is published
          python -m scripts.release notes "${TAG}" > /dev/null
      # The checks here don't run the tests: require a successful run of the
      # CI workflow for a push of the release commit (to `dev`); runs for pull
      # requests test merge commits, not the commit itself. A successful
      # re-run of CI counts; the step also fails while CI is still running
      - name: Check that CI passed for the release commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          runs="$(gh api "repos/${REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&event=push&status=success&per_page=1" \
              --jq .total_count)"
          if [[ ! "${runs}" =~ ^[0-9]+$ || "${runs}" -lt 1 ]]; then
              echo "::error::No successful run of the CI workflow (ci.yml) for a push of ${GITHUB_SHA}; once CI passed for it, re-run this workflow"
              exit 1
          fi
      # The meta distribution only after its pins: every plugin version that
      # its extras pin must be on PyPI, or its release couldn't be installed.
      # Push the plugin tags first; if this fails, re-run the failed jobs
      # once those releases are on PyPI. Plugins pin nothing
      - name: Check pinned plugins
        env:
          TAG: ${{ github.ref_name }}
        run: python -m scripts.release pins "${TAG}"
      # The uv version's checksum is verified by the action
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      # PyPI can't resolve the relative image paths of the package's README:
      # they become absolute URLs pinned to the release tag, so the long
      # description of the package shows the images (the paths are relative
      # to the package's directory, as on GitHub; `scripts/readme_images.py`)
      - name: Make README image paths absolute
        env:
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PACKAGE: ${{ steps.package.outputs.path }}
        run: |
          python -m scripts.readme_images rewrite \
              "https://raw.githubusercontent.com/${REPOSITORY}/${TAG}/${PACKAGE}" \
              "${PACKAGE}/README.md"
          python -m scripts.readme_images check "${PACKAGE}/README.md"
      # The build backend is pinned (`build-constraint-dependencies` in the
      # root `pyproject.toml`). The commit's time as the build time makes the
      # wheels reproducible. No `.gitignore` in `dist/` (uv writes one by
      # default), which would be uploaded and fail the checks
      - name: Build distributions
        env:
          NAME: ${{ steps.package.outputs.name }}
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          uv build --package "${NAME}" --out-dir dist --no-create-gitignore
      # twine from `uv.lock` (dependency group `release`), with hashes
      - name: Check distributions
        env:
          NAME: ${{ steps.package.outputs.name }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          python -m scripts.checks dist dist
          stem="$(python -c 'import re, sys; print(re.sub(r"[-_.]+", "_", sys.argv[1]).lower())' "${NAME}")"
          ls "dist/${stem}-${VERSION}.tar.gz" "dist/${stem}-${VERSION}-py3-none-any.whl"
          if [[ "$(find dist -type f | wc -l)" -ne 2 ]]; then
              echo "::error::Unexpected files in dist/"
              exit 1
          fi
          uv run --frozen --only-group release twine check --strict dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # SLSA build provenance of the distributions (GitHub artifact
  # attestations), verifiable with `gh attestation verify`
  attest:
    name: Attest distributions
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Sigstore signing certificates
      attestations: write # GitHub artifact attestations
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
          # No artifact metadata storage record (needs another permission)
          create-storage-record: false

  # The package's image (`prepare`, step "Determine image"; skipped for
  # packages without one), built from the pushed commit once and pushed by
  # digest only (untagged, with SBOM and provenance attestations), for
  # `scan` to scan and `image` to sign and tag, as cloud-registry's release
  # images. Digests of runs that fail (or fail the scan) are never signed or
  # tagged, but stay on Docker Hub, untagged (pullable by digest only).
  # Linux/amd64 only, as in CI
  push:
    name: Push release image
    needs: prepare
    if: ${{ needs.prepare.outputs.image != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Docker Hub secrets
    environment: release
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Only the labels of the release (version and commit): the others are
      # those of the Dockerfile
      - name: Build and push image by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ needs.prepare.outputs.path }}
          file: ${{ needs.prepare.outputs.path }}/image/Dockerfile
          platforms: linux/amd64
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
          labels: |
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

  # Scans exactly the pushed digest (`<image>@<digest>`; public, so pulling it
  # needs no login) with Trivy (shared action
  # `elixir-cloud-aai/.github/actions/scan-image`; fails on fixable critical
  # and high vulnerabilities, except those accepted in `.trivyignore.yaml`),
  # so that vulnerabilities published since CI scanned the commit block the
  # release, and runs the image's smoke test (`<package>/image/smoke.sh`, if
  # there is one) on it, as CI does on its build. Kept apart from `push` and
  # `image`, so that Trivy (whose binary is resolved from its release tag at
  # run time) and the image never run next to the Docker Hub credentials or
  # the signing identity. CI uploads the results to code scanning
  scan:
    name: Scan release image
    needs: [prepare, push]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check image digest
        env:
          DIGEST: ${{ needs.push.outputs.digest }}
        run: |
          if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Invalid image digest '${DIGEST}'"
              exit 1
          fi
      - name: Scan image
        uses: elixir-cloud-aai/.github/actions/scan-image@743e82d290a53768454999e413756a924e383259 # v1.0.0
        with:
          image: ${{ needs.prepare.outputs.image }}@${{ needs.push.outputs.digest }}
          category: release
          upload: "false"
      - name: Run smoke test
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}@${{ needs.push.outputs.digest }}
          PACKAGE: ${{ needs.prepare.outputs.path }}
        run: |
          if [[ -f "${PACKAGE}/image/smoke.sh" ]]; then
              "${PACKAGE}/image/smoke.sh" "${IMAGE}"
          else
              echo "::notice::${PACKAGE}/image/smoke.sh doesn't exist; no smoke test"
          fi

  # Attests the build provenance of the scanned digest (GitHub artifact
  # attestation, also pushed to the registry), signs it (Sigstore keyless
  # signing with the workflow's OIDC identity, `cosign`) and only then tags
  # exactly that digest with the package's version (`X.Y.Z`; no `latest`:
  # operators set the image by digest or version), so that the published
  # image is the scanned one; before PyPI, so that a release on PyPI always
  # has its image. Re-runs of failed jobs sign and tag the same digest
  # again (no change); a version tag that points to another digest (e.g.,
  # after "Re-run all jobs") fails the job, as published tags must not move
  image:
    name: Release image
    needs: [prepare, push, scan]
    if: ${{ needs.prepare.outputs.image != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Docker Hub secrets
    environment: release
    permissions:
      contents: read
      id-token: write # Sigstore signing certificates
      attestations: write # GitHub artifact attestations
    env:
      IMAGE: ${{ needs.prepare.outputs.image }}
      DIGEST: ${{ needs.push.outputs.digest }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Check image digest
        run: |
          if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Invalid image digest '${DIGEST}'"
              exit 1
          fi
      # The tag must still name the commit that was built (cf. job `pypi`)
      - name: Check tag
        env:
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          refs="$(git ls-remote --tags "${REPOSITORY}" "refs/tags/${TAG}" "refs/tags/${TAG}^{}")"
          # Annotated tags: the commit is the peeled ref (`^{}`)
          commit="$(awk -v ref="refs/tags/${TAG}^{}" '$2 == ref { print $1 }' <<< "${refs}")"
          if [[ -z "${commit}" ]]; then
              commit="$(awk -v ref="refs/tags/${TAG}" '$2 == ref { print $1 }' <<< "${refs}")"
          fi
          if [[ "${commit}" != "${GITHUB_SHA}" ]]; then
              echo "::error::${TAG} points to '${commit}', not to the built commit ${GITHUB_SHA}"
              exit 1
          fi
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Before anything is attested or signed: only a missing tag or one of
      # this digest may be (re)tagged; other errors fail the step
      - name: Check version tag
        run: |
          tag="${IMAGE}:${VERSION}"
          if manifest="$(docker buildx imagetools inspect "${tag}" \
              --format '{{ json .Manifest }}' 2> "${RUNNER_TEMP}/inspect.err")"; then
              actual="$(jq -r .digest <<< "${manifest}")"
              if [[ "${actual}" != "${DIGEST}" ]]; then
                  echo "::error::${tag} points to ${actual} already, not to ${DIGEST}; published tags don't move: release a new version"
                  exit 1
              fi
              echo "::notice::${tag} points to ${DIGEST} already"
          elif grep -qi "not found" "${RUNNER_TEMP}/inspect.err"; then
              echo "${tag} doesn't exist yet"
          else
              cat "${RUNNER_TEMP}/inspect.err" >&2
              exit 1
          fi
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true
          # No artifact metadata storage record (needs another permission)
          create-storage-record: false
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      # The signature covers the digest, and so every tag of it
      - name: Sign image
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      # The tag points to the checked, scanned and signed digest: a single
      # source is copied as is
      - name: Tag image
        run: |
          tag="${IMAGE}:${VERSION}"
          docker buildx imagetools create --tag "${tag}" "${IMAGE}@${DIGEST}"
          actual="$(docker buildx imagetools inspect "${tag}" \
              --format '{{ json .Manifest }}' | jq -r .digest)"
          if [[ "${actual}" != "${DIGEST}" ]]; then
              echo "::error::${tag} points to ${actual}, expected ${DIGEST}"
              exit 1
          fi

  # As in FOCA. The pending trusted publisher of each PyPI project names this
  # workflow file (`release.yml`) and the environment `release`; renaming
  # either breaks publishing until the maintainer updates PyPI
  # After the package's image, if it has one (`image` must have succeeded);
  # for packages without one, `push`, `scan` and `image` are skipped, which a
  # job's default condition would treat as a failure of its dependencies
  pypi:
    name: Release package
    needs: [prepare, attest, image]
    if: >-
      ${{ !cancelled()
        && needs.prepare.result == 'success'
        && needs.attest.result == 'success'
        && (needs.image.result == 'success'
          || (needs.image.result == 'skipped' && needs.prepare.outputs.image == '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: release
      url: https://pypi.org/project/${{ needs.prepare.outputs.name }}/${{ needs.prepare.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # The tag must still name the commit that was built (a tag ruleset
      # should forbid moving it; see "Releasing" in the docs)
      - name: Check tag
        env:
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          refs="$(git ls-remote --tags "${REPOSITORY}" "refs/tags/${TAG}" "refs/tags/${TAG}^{}")"
          # Annotated tags: the commit is the peeled ref (`^{}`)
          commit="$(awk -v ref="refs/tags/${TAG}^{}" '$2 == ref { print $1 }' <<< "${refs}")"
          if [[ -z "${commit}" ]]; then
              commit="$(awk -v ref="refs/tags/${TAG}" '$2 == ref { print $1 }' <<< "${refs}")"
          fi
          if [[ "${commit}" != "${GITHUB_SHA}" ]]; then
              echo "::error::${TAG} points to '${commit}', not to the built commit ${GITHUB_SHA}"
              exit 1
          fi
      # PEP 740 attestations (Sigstore) for every file, made by the action
      # with the workflow's OIDC identity
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          attestations: true
          # PyPI files are immutable; skip those already uploaded, so that
          # re-running a partially failed upload completes the release
          skip-existing: true

  publish:
    name: Publish release
    needs: [prepare, pypi]
    # `pypi` has a condition of its own; this job runs only once it released
    # the package (skipped jobs before it would skip this one by default)
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.pypi.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          # The package's earlier tags and history, for the list of commits
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # The notes, in the format of all release notes of the organization:
      # the version's section of the package's changelog (intro and grouped
      # sections, raised from `###` to `##`), then `## Commits`. After an
      # earlier tag of the package (tags that match `^<distribution>-v[0-9]`,
      # so not those of other packages), these are GitHub's generated notes
      # since that tag, verbatim without their `## What's Changed` header and
      # ending with their `**Full Changelog**` line; they ignore paths, so
      # they list all pull requests of the repository since that tag. On the
      # package's first release there is no such tag, and without one GitHub
      # starts at the newest release of any package (not at the start of the
      # history), so they are the commits that changed the package's
      # directory, with a link to its history. Assets of a
      # published immutable release can't be changed, so the release is
      # created as a draft, gets the distributions, and is published last.
      # Re-runs finish a draft of an earlier attempt and leave a published
      # release as it is if it has exactly the built distributions. The
      # previous tag is the newest tag of the package among the ancestors of
      # the built commit, pre-releases included (`python -m scripts.release
      # previous`)
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          NAME: ${{ needs.prepare.outputs.name }}
          PACKAGE: ${{ needs.prepare.outputs.path }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          # The tag must still name the built commit (cf. job `pypi`)
          commit="$(git ls-remote --tags origin "refs/tags/${TAG}^{}" | cut -f 1)"
          if [[ -z "${commit}" ]]; then
              commit="$(git ls-remote --tags origin "refs/tags/${TAG}" | cut -f 1)"
          fi
          if [[ "${commit}" != "${GITHUB_SHA}" ]]; then
              echo "::error::${TAG} points to '${commit}', not to the built commit ${GITHUB_SHA}"
              exit 1
          fi
          # Only a missing release means "none"; other errors fail the step
          if state="$(gh release view "${TAG}" --json isDraft --jq \
              'if .isDraft then "draft" else "published" end' 2> "${RUNNER_TEMP}/view.err")"; then
              :
          elif grep -qx "release not found" "${RUNNER_TEMP}/view.err"; then
              state=none
          else
              cat "${RUNNER_TEMP}/view.err" >&2
              exit 1
          fi
          # A published release must have exactly these distributions (those
          # of the built commit), or it is of other code
          if [[ "${state}" == "published" ]]; then
              gh api "repos/${GH_REPO}/releases/tags/${TAG}" \
                  --jq '.assets[] | "\(.digest | ltrimstr("sha256:"))  \(.name)"' \
                  | sort > "${RUNNER_TEMP}/published.sha256"
              (cd dist && sha256sum -- *) | sort > "${RUNNER_TEMP}/built.sha256"
              if ! diff "${RUNNER_TEMP}/published.sha256" "${RUNNER_TEMP}/built.sha256"; then
                  echo "::error::The published release ${TAG} has other files than the built commit ${GITHUB_SHA}"
                  exit 1
              fi
              echo "::notice::${TAG} is already published"
              exit 0
          fi
          if [[ "${state}" == "none" ]]; then
              notes="${RUNNER_TEMP}/notes.md"
              python -m scripts.release notes "${TAG}" > "${notes}"
              previous="$(python -m scripts.release previous "${TAG}" "${GITHUB_SHA}")"
              printf '\n## Commits\n\n' >> "${notes}"
              if [[ -n "${previous}" ]]; then
                  gh api "repos/${GH_REPO}/releases/generate-notes" \
                      -f "tag_name=${TAG}" -f "previous_tag_name=${previous}" \
                      --jq .body | sed '/^## What.s Changed$/d' >> "${notes}"
              else
                  {
                      git log --format='* %s (%h)' "${GITHUB_SHA}" -- "${PACKAGE}"
                      printf '\n**Full Changelog**: https://github.com/%s/commits/%s/%s\n' \
                          "${GH_REPO}" "${GITHUB_SHA}" "${PACKAGE}"
                  } >> "${notes}"
              fi
              gh release create "${TAG}" \
                  --draft \
                  --verify-tag \
                  --title "${NAME} ${TAG##*-v}" \
                  --notes-file "${notes}" \
                  --latest=false \
                  --prerelease="${PRERELEASE}"
          fi
          # Uploads to drafts may replace the assets of an earlier attempt
          gh release upload "${TAG}" dist/* --clobber
          gh release edit "${TAG}" --prerelease="${PRERELEASE}" --draft=false
