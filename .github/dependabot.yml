version: 2
# Every entry targets `dev` (`target-branch`), which takes all pull
# requests whatever the default branch is (`main` only moves forward to
# releases); security updates always target the default branch, though
updates:
  # `uv.lock` and the `pyproject.toml` files of the workspace (the root and
  # every package)
  - package-ecosystem: uv
    directory: /
    labels: ["type: dependencies"]
    schedule:
      interval: monthly
    target-branch: dev
    versioning-strategy: increase-if-necessary
    groups:
      # Dependencies of the documentation (the `docs` group), in pull
      # requests of their own
      docs-dependencies:
        patterns: ["mkdocs", "mkdocs-*", "pymdown-extensions"]
      # Dependencies match the first group listed
      python-dependencies:
        patterns: ["*"]
  # The image of `tes.data.crypt4gh`'s decryption executor: the digest of its
  # base image (`Dockerfile`; Python versions are chosen deliberately, so
  # minor and major updates are left out) and its Python packages
  # (`requirements.txt`, compiled from `requirements.in`)
  - package-ecosystem: docker
    directory: /plugins/tes/data/crypt4gh/image
    labels: ["type: dependencies"]
    schedule:
      interval: monthly
    target-branch: dev
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: pip
    directory: /plugins/tes/data/crypt4gh/image
    labels: ["type: dependencies"]
    schedule:
      interval: monthly
    target-branch: dev
    # `crypt4gh` itself is updated by hand, together with the version that
    # the tests use (see `requirements.in`); its dependencies by Dependabot
    ignore:
      - dependency-name: crypt4gh
    groups:
      crypt4gh-image:
        patterns: ["*"]
  # The images of the end-to-end test of `tes.data.crypt4gh`: the base
  # images of `Dockerfile.protes` and `Dockerfile.funnel` (proTES, uv,
  # Funnel, the Docker CLI) and the images of `compose.yaml` (MongoDB,
  # RabbitMQ), by tag and digest
  - package-ecosystem: docker
    directory: /plugins/tes/data/crypt4gh/e2e
    labels: ["type: dependencies"]
    schedule:
      interval: monthly
    target-branch: dev
    groups:
      crypt4gh-e2e-images:
        patterns: ["*"]
  - package-ecosystem: docker-compose
    directory: /plugins/tes/data/crypt4gh/e2e
    labels: ["type: dependencies"]
    schedule:
      interval: monthly
    target-branch: dev
    # Major versions by hand, as in proTES (e.g., MongoDB 8.0 refuses to
    # start on some Linux kernels)
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      crypt4gh-e2e-compose:
        patterns: ["*"]
  # Actions in the workflows
  - package-ecosystem: github-actions
    directory: /
    labels: ["type: dependencies"]
    schedule:
      interval: monthly
    target-branch: dev
    groups:
      github-actions:
        patterns: ["*"]
  # Hook revisions in `.pre-commit-config.yaml`
  - package-ecosystem: pre-commit
    directory: /
    labels: ["type: dependencies"]
    schedule:
      interval: monthly
    target-branch: dev
    groups:
      pre-commit:
        patterns: ["*"]
