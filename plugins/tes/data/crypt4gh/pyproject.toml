# The configuration of the tools (ruff, mypy, pytest, coverage) is shared,
# in the `pyproject.toml` of the repository root

[build-system]
# setuptools 83 fixes CVE-2026-59890 (exclusions of `MANIFEST.in` bypassed in
# sdists), as in FOCA
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
# `foca-plugin-<group>-<subgroup>-<name>`
name = "foca-plugin-tes-data-crypt4gh"
# SemVer, bumped in the release pull request (tag
# `foca-plugin-tes-data-crypt4gh-v<version>`; see "Releasing" in the docs)
version = "0.1.0"
description = "FOCA gateway plugin that decrypts the Crypt4GH inputs of TES tasks in an extra executor"
readme = "README.md"
# FOCA's `requires-python` (plugins run in the environments of FOCA apps)
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "ELIXIR On-Cloud", email = "cloud-service@elixir-europe.org" },
]
keywords = ["foca", "foca-plugin", "gateway", "ga4gh", "tes", "crypt4gh", "encryption"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]
dependencies = [
    # The plugin API of FOCA 0.18 to 0.22 (`foca.plugins`, API version 1);
    # raise the upper bound once CI has tested the next minor version
    "foca>=0.18.0,<0.23",
    "pydantic>=2.7,<3",
]

[project.urls]
Homepage = "https://github.com/elixir-cloud-aai/foca-plugins/tree/dev/plugins/tes/data/crypt4gh"
Documentation = "https://foca-plugins.readthedocs.io/"
Changelog = "https://github.com/elixir-cloud-aai/foca-plugins/blob/dev/plugins/tes/data/crypt4gh/CHANGELOG.md"
Issues = "https://github.com/elixir-cloud-aai/foca-plugins/issues"

# The plugin ID (`<group>.<subgroup>.<name>`) and its class
[project.entry-points."foca.plugins"]
"tes.data.crypt4gh" = "foca_plugins.tes.data.crypt4gh:Crypt4gh"

# `foca_plugins` and the packages of the plugin's group and subgroup are
# namespace packages shared with the other plugins (PEP 420): the wheel
# contains this plugin's package only
[tool.setuptools.packages.find]
where = ["src"]
include = ["foca_plugins.tes.data.crypt4gh"]
namespaces = true

[tool.setuptools.package-data]
"foca_plugins.tes.data.crypt4gh" = ["py.typed"]
